name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Prepare Web Assets Directory
        run: |
          mkdir -p www
          cp index.html www/
          if [ -d src ]; then cp -r src www/; fi

      - name: Sync Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Gradlew missing, regenerating android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VMS-EMP-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
